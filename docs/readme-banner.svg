    <rect x="692" y="112" width="92" height="190" rx="15" fill="#080e19"/>
    <rect x="724" y="120" width="28" height="5" rx="2.5" fill="#354960"/>
    <circle cx="738" cy="215" r="25" fill="#65d6d1" opacity=".1"/>
    <circle cx="738" cy="215" r="14" fill="none" stroke="#65d6d1" stroke-width="2"/>
    <path d="M738 209 V179 M730 187 L738 179 L746 187" fill="none" stroke="#65d6d1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M781 84 Q798 42 845 42" fill="none" stroke="#65d6d1" stroke-width="3" stroke-dasharray="5 8" stroke-linecap="round"/>
